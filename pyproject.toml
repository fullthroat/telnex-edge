[project]
name = "function"
description = "Skatteverket Telnyx Edge Function"
version = "0.1.0"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "kaunain" }
]
dependencies = [
  "cryptography>=41,<45"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["function"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"